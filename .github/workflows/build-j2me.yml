name: Build J2ME MIDlet

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Download CLDC/MIDP stubs (versiones reales)
        run: |
          mkdir -p libs
          # cldcapi11 2.0.4 es la versión estable en Maven Central
          wget -q https://repo1.maven.org/maven2/org/microemu/cldcapi11/2.0.4/cldcapi11-2.0.4.jar -O libs/cldcapi11.jar
          # midpapi20 también existe en 2.0.4
          wget -q https://repo1.maven.org/maven2/org/microemu/midpapi20/2.0.4/midpapi20-2.0.4.jar -O libs/midpapi20.jar
          # ProGuard 7.1.1
          wget -q https://github.com/Guardsquare/proguard/releases/download/v7.1.1/proguard-7.1.1.zip -O proguard.zip
          unzip -q proguard.zip -d proguard
          mv proguard/proguard-7.1.1/lib/proguard.jar libs/proguard.jar
          # Verificación: si algún JAR está vacío o no existe, el paso falla aquí
          ls -lh libs/*.jar

      - name: Compile and package
        run: |
          mkdir -p build/classes dist
          # Compilación exacta que exige MIDP 2.0
          javac -source 1.3 -target 1.1 \
            -bootclasspath libs/cldcapi11.jar:libs/midpapi20.jar \
            -classpath libs/cldcapi11.jar:libs/midpapi20.jar \
            -d build/classes \
            src/PruebaAudioMIDlet.java

          # Preverificación con ProGuard
          java -jar libs/proguard.jar \
            -microedition \
            -dontobfuscate -dontoptimize \
            -injars build/classes \
            -outjars build/preverified.jar \
            -libraryjars libs/cldcapi11.jar \
            -libraryjars libs/midpapi20.jar \
            -keep public class * extends javax.microedition.midlet.MIDlet

          # Empaquetado final con el MANIFEST.MF
          jar cfm dist/PruebaAudioMIDlet.jar MANIFEST.MF -C build/preverified.jar .

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PruebaAudioMIDlet
          path: dist/PruebaAudioMIDlet.jar
