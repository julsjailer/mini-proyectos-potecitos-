name: Build J2ME MIDlet

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Verify javac
        run: javac -version

      - name: Download CLDC/MIDP stubs
        run: |
          mkdir -p libs
          wget -q https://repo1.maven.org/maven2/org/microemu/cldcapi11/2.0.4/cldcapi11-2.0.4.jar -O libs/cldcapi11.jar
          wget -q https://repo1.maven.org/maven2/org/microemu/midpapi20/2.0.4/midpapi20-2.0.4.jar -O libs/midpapi20.jar
          ls -lh libs/

      - name: Compile RecordControl stub
        run: |
          mkdir -p build/stubs
          javac -source 1.3 -target 1.1 \
            -bootclasspath libs/cldcapi11.jar:libs/midpapi20.jar \
            -d build/stubs \
            stubs/javax/microedition/media/control/RecordControl.java
          echo "OK stub"
          find build/stubs -name "*.class"

      - name: Compile MIDlet
        run: |
          mkdir -p build/classes
          javac -source 1.3 -target 1.1 \
            -bootclasspath libs/cldcapi11.jar:libs/midpapi20.jar:build/stubs \
            -classpath libs/cldcapi11.jar:libs/midpapi20.jar:build/stubs \
            -d build/classes \
            src/PruebaAudioMIDlet.java
          echo "OK MIDlet"
          ls -lh build/classes

      - name: Package JAR
        run: |
          mkdir -p dist
          jar cfm dist/PruebaAudioMIDlet.jar MANIFEST.MF -C build/classes .
          ls -lh dist/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PruebaAudioMIDlet
          path: dist/PruebaAudioMIDlet.jar
