name: Build J2ME MIDlet
'on':
  push:
    branches: [main, fix/grabacion-audio-interfaz]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build diagnostic artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs build/stubsrc/javax/microedition/media/control build/stubs build/classes dist
          for api in cldcapi11 midpapi20; do
            curl -fL --retry 3 "https://repo.maven.apache.org/maven2/org/microemu/$api/2.0.4/$api-2.0.4.jar" -o "libs/$api.jar"
            jar tf "libs/$api.jar" > /dev/null
          done
          BASE=build/stubsrc/javax/microedition/media
          printf '%s\n' 'package javax.microedition.media; public interface Control {}' > "$BASE/Control.java"
          printf '%s\n' 'package javax.microedition.media; public class MediaException extends Exception { public MediaException() {} public MediaException(String s) { super(s); } }' > "$BASE/MediaException.java"
          printf '%s\n' 'package javax.microedition.media; public interface Player { int STARTED=400; void realize() throws MediaException; void start() throws MediaException; void stop() throws MediaException; void close(); int getState(); Control getControl(String s); }' > "$BASE/Player.java"
          printf '%s\n' 'package javax.microedition.media; public class Manager { public static Player createPlayer(String s) throws java.io.IOException, MediaException { return null; } public static Player createPlayer(java.io.InputStream s, String t) throws java.io.IOException, MediaException { return null; } }' > "$BASE/Manager.java"
          printf '%s\n' 'package javax.microedition.media.control; public interface RecordControl extends javax.microedition.media.Control { void setRecordStream(java.io.OutputStream s); void startRecord(); void stopRecord(); void commit() throws java.io.IOException; }' > "$BASE/control/RecordControl.java"
          printf '%s\n' 'package javax.microedition.media.control; public interface VolumeControl extends javax.microedition.media.Control { int setLevel(int n); }' > "$BASE/control/VolumeControl.java"
          CP=libs/cldcapi11.jar:libs/midpapi20.jar
          javac -source 1.6 -target 1.6 -bootclasspath "$CP" -d build/stubs $(find build/stubsrc -name '*.java')
          javac -source 1.6 -target 1.6 -bootclasspath "$CP:build/stubs" -classpath "$CP:build/stubs" -d build/classes src/PruebaAudioMIDlet.java
          VERSION=0.1.0
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected tag vMAJOR.MINOR.PATCH'; exit 1; }
          printf '%s\n' 'Manifest-Version: 1.0' 'MIDlet-1: PruebaAudioMIDlet, , PruebaAudioMIDlet' 'MIDlet-Name: PruebaAudioMIDlet' 'MIDlet-Vendor: Prueba' "MIDlet-Version: $VERSION" 'MicroEdition-Configuration: CLDC-1.1' 'MicroEdition-Profile: MIDP-2.0' '' > build/MANIFEST.MF
          jar cfm dist/PruebaAudioMIDlet.jar build/MANIFEST.MF -C build/classes .
          cp build/MANIFEST.MF dist/PruebaAudioMIDlet.jad
          printf '%s\n' "MIDlet-Jar-Size: $(stat -c%s dist/PruebaAudioMIDlet.jar)" 'MIDlet-Jar-URL: PruebaAudioMIDlet.jar' >> dist/PruebaAudioMIDlet.jad
          printf '%s\n' 'Diagnostic build: Java 6 bytecode, not CLDC-preverified. Device compatibility NOT validated.' > dist/BUILD-NOTES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PruebaAudioMIDlet-diagnostic
          path: dist/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PruebaAudioMIDlet-diagnostic
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Prueba de Audio $GITHUB_REF_NAME" --notes-file dist/BUILD-NOTES.txt dist/*
