name: Build J2ME MIDlet

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Download CLDC/MIDP stubs + ProGuard
        run: |
          mkdir -p libs
          wget -q https://repo1.maven.org/maven2/org/microemu/cldcapi11/2.0.4/cldcapi11-2.0.4.jar -O libs/cldcapi11.jar
          wget -q https://repo1.maven.org/maven2/org/microemu/midpapi20/2.0.4/midpapi20-2.0.4.jar -O libs/midpapi20.jar
          wget -q https://github.com/Guardsquare/proguard/releases/download/v7.1.1/proguard-7.1.1.zip -O proguard.zip
          unzip -q proguard.zip -d proguard
          mv proguard/proguard-7.1.1/lib/proguard.jar libs/proguard.jar
          ls -lh libs/

      - name: Compile RecordControl stub
        run: |
          mkdir -p build/stubs
          javac -source 1.3 -target 1.1 \
            -bootclasspath libs/cldcapi11.jar:libs/midpapi20.jar \
            -d build/stubs \
            stubs/javax/microedition/media/control/RecordControl.java

      - name: Package stub into JAR
        run: |
          cd build/stubs
          jar cf ../../libs/stubs.jar .
          cd ../..
          ls -lh libs/stubs.jar

      - name: Compile MIDlet
        run: |
          mkdir -p build/classes
          javac -source 1.3 -target 1.1 \
            -bootclasspath libs/cldcapi11.jar:libs/midpapi20.jar:build/stubs \
            -classpath libs/cldcapi11.jar:libs/midpapi20.jar:build/stubs \
            -d build/classes \
            src/PruebaAudioMIDlet.java

      - name: Create ProGuard config file
        run: |
          printf '%s\n' \
            '-microedition' \
            '-dontobfuscate' \
            '-dontoptimize' \
            '-dontwarn' \
            '-injars build/classes' \
            '-outjars build/preverified.jar' \
            '-libraryjars libs/cldcapi11.jar' \
            '-libraryjars libs/midpapi20.jar' \
            '-libraryjars libs/stubs.jar' \
            '-keep public class PruebaAudioMIDlet { public <init>(); }' \
            > proguard.cfg
          cat proguard.cfg

      - name: Preverify with ProGuard
        run: |
          java -jar libs/proguard.jar @proguard.cfg
          ls -lh build/preverified.jar

      - name: Package JAR and JAD
        run: |
          mkdir -p dist build/preverified
          # El paso anterior deja un JAR; hay que extraerlo a un directorio
          cd build/preverified
          jar xf ../preverified.jar
          cd ../..
          # Ahora sí, empaquetar con nuestro MANIFEST.MF
          jar cfm dist/PruebaAudioMIDlet.jar MANIFEST.MF -C build/preverified .
          # Generar el JAD con el tamaño real
          JAR_SIZE=$(stat -c%s dist/PruebaAudioMIDlet.jar)
          printf '%s\n' \
            'MIDlet-1: PruebaAudioMIDlet, , PruebaAudioMIDlet' \
            "MIDlet-Jar-Size: $JAR_SIZE" \
            'MIDlet-Jar-URL: PruebaAudioMIDlet.jar' \
            'MIDlet-Name: PruebaAudioMIDlet' \
            'MIDlet-Vendor: Prueba' \
            'MIDlet-Version: 1.0' \
            'MicroEdition-Configuration: CLDC-1.1' \
            'MicroEdition-Profile: MIDP-2.0' \
            > dist/PruebaAudioMIDlet.jad
          ls -lh dist/

      - name: Upload JAR and JAD
        uses: actions/upload-artifact@v4
        with:
          name: PruebaAudioMIDlet
          path: |
            dist/PruebaAudioMIDlet.jar
            dist/PruebaAudioMIDlet.jad
